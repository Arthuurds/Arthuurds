name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0b0d12&color_dots=#ebedf0,#c9d3ff,#94a7ff,#4d6dff,#2a3fa8
            dist/snake-dark.svg?palette=github-dark&color_snake=#4d6dff&color_dots=#161b22,#1c2550,#2a3fa8,#3d58e0,#4d6dff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
